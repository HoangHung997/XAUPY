name: Apply audited first-release source
on:
  push:
    branches: ['release/1.0-completion-20260929']
    paths: ['.ci/**', '.github/workflows/apply-first-release-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/release/1.0-completion-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0-completion-20260929
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate and apply exact audited source
        run: python .ci/apply_rc1.py
      - name: Validate source and regression suite
        run: |
          python -m pip install -r python/requirements-runtime.txt
          python -m compileall -q python scripts
          python -m unittest discover -s python/tests -q
      - name: Commit reviewed release source on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs installer mql5 python scripts src tests
          git add -u .ci
          git diff --cached --stat
          git commit -m 'Complete RC1 execution safety, ten-tab workflows and delivery acceptance'
          git push origin HEAD:refs/heads/release/1.0-completion-20260929
