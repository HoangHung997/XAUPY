name: Desktop audit toolchain
on:
  push:
    branches: ['release/1.0-completion-20260929']
    paths: ['.github/workflows/desktop-audit-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore isolated audit dependencies
        shell: bash
        run: |
          export NUGET_PACKAGES="$GITHUB_WORKSPACE/audit-tools/nuget"
          dotnet restore tests/XAUPY.Desktop.InteractionTests/XAUPY.Desktop.InteractionTests.csproj
          dotnet restore tests/XAUPY.Ipc.ContractTests/XAUPY.Ipc.ContractTests.csproj
          find audit-tools/nuget -type f -name '*.nupkg' -delete
          tar czf desktop-audit-nuget.tgz -C audit-tools nuget
          sha256sum desktop-audit-nuget.tgz > desktop-audit.sha256
          ls -lh desktop-audit-nuget.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-audit-nuget-expanded
          path: |
            desktop-audit-nuget.tgz
            desktop-audit.sha256
          retention-days: 1
          if-no-files-found: error
