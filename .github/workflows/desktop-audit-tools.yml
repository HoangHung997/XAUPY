name: Desktop audit toolchain
on:
  push:
    branches: ['release/1.0-completion-20260929']
    paths: ['.github/workflows/desktop-audit-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore isolated audit dependencies
        shell: bash
        run: |
          export NUGET_PACKAGES="$RUNNER_TEMP/xaupy-audit-nuget"
          dotnet restore tests/XAUPY.Desktop.InteractionTests/XAUPY.Desktop.InteractionTests.csproj
          dotnet restore tests/XAUPY.Ipc.ContractTests/XAUPY.Ipc.ContractTests.csproj
      - name: Archive compiler and restored dependencies for offline audit
        shell: bash
        run: |
          set -euo pipefail
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          sdk="$(dotnet --version)"
          mkdir -p audit-tools/dotnet audit-tools/nuget
          cd "$root"
          runtime="$(ls shared/Microsoft.NETCore.App | grep '^10\.' | sort -V | tail -1)"
          ref="$(ls packs/Microsoft.NETCore.App.Ref | grep '^10\.' | sort -V | tail -1)"
          apphost="$(ls packs/Microsoft.NETCore.App.Host.linux-x64 | grep '^10\.' | sort -V | tail -1)"
          fxr="$(ls host/fxr | grep '^10\.' | sort -V | tail -1)"
          tar cf - dotnet "host/fxr/$fxr" "sdk/$sdk" "shared/Microsoft.NETCore.App/$runtime" "packs/Microsoft.NETCore.App.Ref/$ref" "packs/Microsoft.NETCore.App.Host.linux-x64/$apphost" | tar xf - -C "$GITHUB_WORKSPACE/audit-tools/dotnet"
          cp -a "$RUNNER_TEMP/xaupy-audit-nuget/." "$GITHUB_WORKSPACE/audit-tools/nuget/"
          cd "$GITHUB_WORKSPACE"
          du -sh audit-tools/*
          tar czf desktop-audit-dotnet.tgz -C audit-tools dotnet
          tar czf desktop-audit-nuget.tgz -C audit-tools nuget
          sha256sum desktop-audit-*.tgz > desktop-audit.sha256
          ls -lh desktop-audit-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-audit-dotnet
          path: |
            desktop-audit-dotnet.tgz
            desktop-audit.sha256
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-audit-nuget
          path: |
            desktop-audit-nuget.tgz
            desktop-audit.sha256
          retention-days: 1
          if-no-files-found: error
