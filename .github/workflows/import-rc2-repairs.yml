name: Import exactly tested RC2 repairs
on:
  push:
    branches: ['release/1.0-completion-20260929']
    paths: ['.github/workflows/import-rc2-repairs.yml']
permissions:
  contents: write
concurrency:
  group: import-tested-rc2-repairs
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/release/1.0-completion-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify immutable baseline and transfer, apply exact tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 29ea5d968379271c8f05a84c551bdc50475ee13f
          python - <<'PY'
          import base64,hashlib,lzma,os
          from pathlib import Path
          paths=[Path('.github/rc2-import')/f'part-{i:02}.b64' for i in range(1,14)]
          packed=base64.b64decode(b''.join(p.read_bytes() for p in paths),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='9fa9344190d1a0ba0e8ab14db7c50814a85e83fcfc86dae225e9081c4a6a9de6'
          patch=lzma.decompress(packed)
          assert len(patch)==420615
          assert hashlib.sha256(patch).hexdigest()=='dd503895b67eeaa763af06678cd03ec1ee278f7f72184bfe9dca8b4a59fff550'
          Path(os.environ['RUNNER_TEMP'],'rc2.patch').write_bytes(patch)
          PY
          git rm -r .github/rc2-import .github/workflows/import-rc2-repairs.yml
          test "$(git write-tree)" = 016f8c06deab61c1c35a2bf8b3a82e0c29c75cf7
          git apply --check --index "$RUNNER_TEMP/rc2.patch"
          git apply --index "$RUNNER_TEMP/rc2.patch"
          git diff --cached --check
          test "$(git write-tree)" = 117e3388e2f1d32a24b0f34a4f46c6f32f6abf8e
          git diff --cached --stat
          current="$(git ls-remote origin refs/heads/release/1.0-completion-20260929 | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: RC2 partial protection, reviewed fail-safe restore, broker capabilities and complete UI workflows'
          test "$(git rev-parse HEAD^{tree})" = 117e3388e2f1d32a24b0f34a4f46c6f32f6abf8e
          git push origin HEAD:refs/heads/release/1.0-completion-20260929
          printf 'IMPORTED_COMMIT=%s\nTESTED_TREE=117e3388e2f1d32a24b0f34a4f46c6f32f6abf8e\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
