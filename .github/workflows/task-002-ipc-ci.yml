name: Task 002 - IPC Lifecycle CI

on:
  push:
    branches:
      - main
      - 'task/002-ipc-lifecycle'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate IPC source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python protocol and lifecycle tests
        run: python -m unittest discover -s python/tests -v

      - name: Restore Desktop and IPC projects
        run: dotnet restore src/XAUPY.Desktop/XAUPY.Desktop.csproj

      - name: Build Desktop Release
        run: dotnet build src/XAUPY.Desktop/XAUPY.Desktop.csproj -c Release --no-restore

      - name: CSharp IPC contract self-test
        run: dotnet run --project tests/XAUPY.Ipc.ContractTests/XAUPY.Ipc.ContractTests.csproj -c Release

  windows-build:
    name: Windows x64 full build
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.14,<7"

      - name: Build packaged Python Engine
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm --onefile --name xaupy-engine --paths python --distpath dist/engine --workpath build/pyinstaller --specpath build/pyinstaller python/engine_entry.py

      - name: Smoke test packaged Engine executable
        run: python scripts/smoke_engine_exe.py dist/engine/xaupy-engine.exe

      - name: Publish Avalonia Windows x64 self-contained
        shell: pwsh
        run: dotnet publish src/XAUPY.Desktop/XAUPY.Desktop.csproj -c Release -r win-x64 --self-contained true -o dist/app

      - name: Assemble full Task 002 build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/app/engine | Out-Null
          Copy-Item dist/engine/xaupy-engine.exe dist/app/engine/xaupy-engine.exe
          New-Item -ItemType Directory -Force -Path dist/app/docs | Out-Null
          Copy-Item docs/PRODUCT_SPEC.md dist/app/docs/PRODUCT_SPEC.md
          Copy-Item docs/IMPLEMENTATION_TASKS.md dist/app/docs/IMPLEMENTATION_TASKS.md
          Copy-Item docs/IPC_PROTOCOL.md dist/app/docs/IPC_PROTOCOL.md
          if (-not (Test-Path dist/app/XAUPY.Desktop.exe)) { throw "XAUPY.Desktop.exe missing from publish output" }
          if (-not (Test-Path dist/app/engine/xaupy-engine.exe)) { throw "xaupy-engine.exe missing from assembled build" }

      - name: Package full build
        shell: pwsh
        run: Compress-Archive -Path dist/app/* -DestinationPath dist/XAUPY-Task002-win-x64.zip -Force

      - name: Upload Task 002 Windows build
        uses: actions/upload-artifact@v4
        with:
          name: XAUPY-Task002-win-x64
          path: dist/XAUPY-Task002-win-x64.zip
          if-no-files-found: error
          retention-days: 14
