name: Task 011 - Backtest Parity CI

on:
  push:
    branches:
      - 'task/011-backtest-parity'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate deterministic Backtest backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python Task 011 and regression tests
        run: python -m unittest discover -s python/tests -v
