name: Task 012 - Cleanup Stale Runs

on:
  push:
    branches:
      - 'task/012-optimizer-walk-forward'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Force-cancel stale branch runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?branch=task%2F012-optimizer-walk-forward&per_page=100"
          payload="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$api")"

          echo "$payload"             | jq -r               --arg sha "$GITHUB_SHA"               --argjson self "$GITHUB_RUN_ID"               '.workflow_runs[]
               | select(
                   (.status == "queued" or .status == "in_progress" or .status == "cancel_requested")
                   and (.id != $self)
                   and (
                     .head_sha != $sha
                     or .name != "Task 012 - Optimizer Walk-Forward CI"
                     or .event != "push"
                   )
                 )
               | .id'             | while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Force-cancelling stale run $run_id"
                curl -fsSL -X POST                   -H "Authorization: Bearer $GH_TOKEN"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel"                   >/dev/null || true
              done
