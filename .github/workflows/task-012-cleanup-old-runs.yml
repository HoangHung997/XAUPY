name: Task 012 - Cleanup Stale Runs

on:
  push:
    branches:
      - 'task/012-optimizer-walk-forward'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale branch runs but keep current commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs?branch=task%2F012-optimizer-walk-forward&per_page=100"
          $payload = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get

          $stale = $payload.workflow_runs | Where-Object {
            ($_.status -eq "queued" -or $_.status -eq "in_progress" -or $_.status -eq "cancel_requested") -and
            $_.head_sha -ne $env:GITHUB_SHA
          }

          foreach ($run in $stale) {
            Write-Host "Cancelling stale run $($run.id) ($($run.name))"
            $cancelUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/cancel"
            try {
              Invoke-RestMethod -Uri $cancelUri -Headers $headers -Method Post | Out-Null
            } catch {
              Write-Host "Cancel request ignored for $($run.id): $($_.Exception.Message)"
            }
          }
