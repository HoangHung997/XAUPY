name: Task 012 - Cleanup Stale Branch Runs

on:
  push:
    branches:
      - 'task/012-optimizer-walk-forward'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older queued/in-progress runs for this branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Keeping current SHA: $CURRENT_SHA"
          gh api --paginate "/repos/$REPO/actions/runs?branch=$BRANCH&per_page=100"             --jq '.workflow_runs[] | select((.status=="queued" or .status=="in_progress") and .head_sha != env.CURRENT_SHA) | .id'             > stale-runs.txt

          count=0
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$CURRENT_RUN" ] && continue
            echo "Cancelling stale run $run_id"
            gh api --method POST "/repos/$REPO/actions/runs/$run_id/cancel" >/dev/null || true
            count=$((count+1))
          done < stale-runs.txt

          echo "Requested cancellation for $count stale run(s)."
