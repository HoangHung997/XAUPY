name: Task 012 - Cleanup stale branch runs

on:
  push:
    branches:
      - task/012-optimizer-walk-forward

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Cancel stale Task 012 branch workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const branch = "task/012-optimizer-walk-forward";
            const currentSha = context.sha;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, branch, per_page: 100 }
            );

            for (const run of runs) {
              if (run.id === currentRunId) continue;
              if (run.head_sha === currentSha) {
                core.info(`Keeping current-head run ${run.id}: ${run.name}`);
                continue;
              }
              if (!["queued", "in_progress", "waiting", "requested", "pending"].includes(run.status)) {
                continue;
              }

              core.info(`Cancelling stale run ${run.id}: ${run.name} @ ${run.head_sha}`);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              } catch (error) {
                core.warning(`Could not cancel run ${run.id}: ${error.message}`);
              }
            }
