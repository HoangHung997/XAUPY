name: Task 012 - Cleanup stale branch runs

on:
  push:
    branches:
      - 'task/012-optimizer-walk-forward'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale Task 012 branch workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"
          branch="task/012-optimizer-walk-forward"

          echo "Keeping current cleanup run: ${current}"
          for page in 1 2 3; do
            response="$(curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${repo}/actions/runs?branch=${branch}&per_page=100&page=${page}")"

            ids="$(printf '%s' "${response}" | jq -r --arg current "${current}" '
              .workflow_runs[]
              | select(
                  (.status == "queued"
                   or .status == "in_progress"
                   or .status == "waiting"
                   or .status == "requested"
                   or .status == "pending")
                  and ((.id | tostring) != $current)
                )
              | .id
            ')"

            if [ -z "${ids}" ]; then
              continue
            fi

            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "Cancelling workflow run ${id}"
              curl -fsSL -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${repo}/actions/runs/${id}/cancel"                 >/dev/null || true
            done <<< "${ids}"
          done
