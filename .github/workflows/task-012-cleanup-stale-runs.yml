name: Task 012 - Cleanup stale branch runs

on:
  push:
    branches:
      - 'task/012-optimizer-walk-forward'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - name: Cancel stale branch workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"
          branch="task/012-optimizer-walk-forward"

          for page in 1 2 3 4; do
            response="$(curl -fsSL               -H "Authorization: Bearer ${GH_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${repo}/actions/runs?branch=${branch}&per_page=100&page=${page}")"

            ids="$(printf '%s' "${response}" | python3 -c '
import json, os, sys
data=json.load(sys.stdin)
current=os.environ["GITHUB_RUN_ID"]
for run in data.get("workflow_runs", []):
    if str(run.get("id")) == current:
        continue
    if run.get("status") in {"queued","in_progress","waiting","requested","pending"}:
        print(run["id"])
')"

            [ -z "${ids}" ] && continue
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "Cancelling stale run ${id}"
              curl -fsSL -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${repo}/actions/runs/${id}/cancel"                 >/dev/null || true
            done <<< "${ids}"
          done
