name: Task 012 - Optimizer Walk-Forward CI

on:
  push:
    branches:
      - 'task/012-optimizer-walk-forward'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate optimizer reproducibility and leakage guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python Task 012 and regression tests
        run: python -m unittest discover -s python/tests -v
